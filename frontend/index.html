<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koperasi Konsumen Karyawan PT Len Industri - Kopkarlen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navbar / Header -->
    <header class="navbar">
        <div class="logo-container">
            <!-- Tempatkan gambar logo Kopkarlen asli di sini jika ada -->
            <h1 class="logo-text">KopKarLen</h1> 
        </div>
        <nav class="nav-menu">
            <a href="#home">HOME</a>
            <a href="#about">ABOUT</a>
            <a href="#visi-misi">VISI MISI</a>
            <a href="#galeri">GALERI</a>
            <a href="#kontak">KONTAK</a>
            <!-- Tambahkan id pada Karir dan Login -->
            <a href="#" id="nav-karir" class="nav-highlight">KARIR</a>
            <a href="login.html" id="nav-login" class="btn-nav-login">LOGIN</a>
        </nav>
    </header>

    <!-- Hero Section (Meniru tampilan ori) -->
    <section id="home" class="hero-section">
        <div class="hero-content">
            <h2>KOPERASI KONSUMEN<br>KARYAWAN PT LEN INDUSTRI (PERSERO)</h2>
            <h1>Tumbuh Bersama,<br>Berdaya, dan Sejahtera</h1>
        </div>
        
        <!-- Action Buttons (Unit-unit) -->
        <div class="unit-buttons">
            <div class="unit-btn">🛒 Unit Pertokoan</div>
            <div class="unit-btn">💰 Unit Simpan Pinjam</div>
            <div class="unit-btn">💼 Unit Bisnis</div>
            <div class="unit-btn">🏢 Unit Rental & Jasa</div>
        </div>
    </section>

    <!-- About Section (Dummy content) -->
    <section id="about" class="about-section">
        <h2>ABOUT</h2>
        <p>Konten About Kopkarlen...</p>
    </section>
<!-- Script Pengecekan Sesi Login -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Ambil data sesi dari browser
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            const role = localStorage.getItem('role');
            
            const karirLink = document.getElementById('nav-karir');
            const loginLink = document.getElementById('nav-login');

            // Logika pencegatan tombol Karir
            karirLink.addEventListener('click', function(e) {
                if (!isLoggedIn) {
                    e.preventDefault(); // Cegah pindah halaman
                    alert("Silakan login terlebih dahulu untuk melihat lowongan Karir.");
                    window.location.href = "login.html"; // Lempar ke halaman login
                } else {
                    window.location.href = "karir.html"; // Izinkan masuk
                }
            });

            // Ubah tombol "LOGIN" menjadi "DASHBOARD" jika sudah login
            if (isLoggedIn) {
                loginLink.textContent = "DASHBOARD";
                if (role === 'admin') {
                    loginLink.href = "admin_dashboard.html";
                } else {
                    loginLink.href = "peserta_dashboard.html";
                }
            }
        });
    </script>
</body>
</html>
