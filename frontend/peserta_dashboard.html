<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pelamar - Kopkarlen</title>
    <link rel="stylesheet" href="/Fullstack-Kopkarlen/frontend/assets/css/style.css" />
    <link rel="stylesheet" href="/Fullstack-Kopkarlen/frontend/assets/css/peserta.css" />

</head>
<body class="dashboard-body">
    <header class="navbar">
        <div class="logo-container"><h1 class="logo-text">KopKarLen</h1></div>
        <nav class="nav-menu">
            <a href="index.html">HOME</a>
            <a href="index.html#about">ABOUT</a>
            <a href="index.html#visi-misi">VISI MISI</a>
            <a href="index.html#galeri">GALERI</a>
            <a href="index.html#kontak">KONTAK</a>
            <a href="karir.html" id="nav-karir" class="nav-highlight">KARIR</a>
            
            <div id="nav-user-container">
                <div class="profile-dropdown-container">
                    <button class="profile-avatar-btn" id="avatarBtn" title="User">U</button>
                    <div class="dropdown-menu" id="profileDropdown">
                        <a href="peserta_dashboard.html">Profil Saya</a>
                        <button id="btnLogout" class="logout-btn">Logout</button>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <div class="dashboard-container profile-layout">
        <aside class="profile-sidebar" style="text-align: center;">
            <img id="profileImage" class="avatar-placeholder" style="display: none;" alt="Foto Profil">
            <div id="profileAvatarText" class="avatar-placeholder">U</div>
            
            <label for="uploadPhotoInput" class="upload-avatar-label">Ganti Foto Profil</label>
            <input type="file" id="uploadPhotoInput" accept="image/*" style="display: none;">

            <h2 id="displayUserName">John Doe</h2>
            <p class="bio" id="displayUserBio">Saya seorang Software Engineer...</p>

            <button class="btn-secondary" id="btnEditProfile" style="margin-bottom: 10px; width: 100%;">Edit Profil & Bio</button>
            
            <div class="progress-bar-container">
                <div class="progress-bar" style="width: 100%;">100%</div>
            </div>
            <button class="btn-secondary" style="margin-top: 10px; width: 100%;">Preview CV</button>
            <button class="btn-primary" style="margin-top: 10px; width: 100%;">Download CV</button>
        </aside>

        <main class="profile-content">
            <!-- Riwayat Pendidikan -->
            <div class="section-card">
                <div class="section-header">
                    <h3>Riwayat Pendidikan</h3>
                    <button class="btn-primary btn-add-item" data-section="pendidikan">+ Tambah Pendidikan</button>
                </div>
                <div id="containerPendidikan"></div>
            </div>

            <!-- Riwayat Pekerjaan -->
            <div class="section-card">
                <div class="section-header">
                    <h3>Riwayat Pekerjaan</h3>
                    <button class="btn-primary btn-add-item" data-section="pekerjaan">+ Tambah Pekerjaan</button>
                </div>
                <div id="containerPekerjaan"></div>
            </div>

            <!-- Riwayat Pelatihan -->
            <div class="section-card">
                <div class="section-header">
                    <h3>Riwayat Pelatihan</h3>
                    <button class="btn-primary btn-add-item" data-section="pelatihan">+ Tambah Pelatihan</button>
                </div>
                <div id="containerPelatihan"></div>
            </div>

            <!-- Sertifikasi -->
            <div class="section-card">
                <div class="section-header">
                    <h3>Sertifikasi</h3>
                    <button class="btn-primary btn-add-item" data-section="sertifikasi">+ Tambah Sertifikasi</button>
                </div>
                <div id="containerSertifikasi"></div>
            </div>
        </main>
    </div>

    <!-- MODAL EDIT PROFIL & BIO -->
    <div class="modal-overlay" id="modalEditProfile">
        <div class="modal-container">
            <div class="modal-header">
                <h3>Edit Profil & Bio</h3>
                <button class="close-modal btnCloseModal">&times;</button>
            </div>
            <form id="formEditProfile">
                <div class="form-group">
                    <label for="inputName">Nama Lengkap</label>
                    <input type="text" id="inputName" required>
                </div>
                <div class="form-group">
                    <label for="inputBio">Deskripsi Diri (Bio)</label>
                    <textarea id="inputBio" rows="4" required></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary btnCancelModal">Batal</button>
                    <button type="submit" class="btn-primary">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL DYNAMIC SECTION ITEM EDIT / ADD -->
    <div class="modal-overlay" id="modalEditSection">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="modalSectionTitle">Detail Riwayat</h3>
                <button class="close-modal btnCloseModal">&times;</button>
            </div>
            <form id="formEditSection">
                <input type="hidden" id="inputSectionType">
                <input type="hidden" id="inputItemIndex" value="-1">
                <div id="dynamicFormFields"></div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary btnCancelModal">Batal</button>
                    <button type="submit" class="btn-primary">Simpan</button>
                </div>
            </form>
        </div>
    </div>
<script src="/Fullstack-Kopkarlen/frontend/assets/js/peserta.js"></script>
</body>
</html>
